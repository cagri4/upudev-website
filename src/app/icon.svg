<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- head -->
  <rect x="4" y="6" width="24" height="20" rx="5" fill="#111"/>
  <!-- antenna -->
  <line x1="16" y1="6" x2="16" y2="2" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <circle cx="16" cy="1.5" r="1.5" fill="#6366f1"/>
  <!-- eyes -->
  <circle cx="11" cy="15" r="3" fill="#6366f1"/>
  <circle cx="21" cy="15" r="3" fill="#6366f1"/>
  <!-- eye glow -->
  <circle cx="12" cy="14" r="1" fill="#a5b4fc"/>
  <circle cx="22" cy="14" r="1" fill="#a5b4fc"/>
  <!-- mouth -->
  <rect x="11" y="21" width="10" height="2" rx="1" fill="#6366f1"/>
</svg>
